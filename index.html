<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6fa8e8">
<link rel="manifest" href="./manifest.json">
<title>ATTENDANCE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@500;600;700;800&display=swap');

:root{
  --bg1:#cfe6fb;
  --bg2:#5f9de3;
  --card1:#d9edff;
  --card2:#9dcbf3;
  --pill:#f5f8fc;
  --pill-border:#e1ecf8;
  --ink:#1c2536;
  --ink-soft:#5c6d8a;
  --accent1:#6b7bf5;
  --accent2:#4a5ee0;
  --absent-dot:#ff6f6f;
  --leave-dot:#ffb347;
  --wa-green:#178a4c;
  --danger:#e0453a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:'Inter',Arial,sans-serif; min-height:100vh;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,.35), transparent 45%),
    linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 100%);
  color:var(--ink); padding:30px 14px 44px; font-weight:600;
}
.container{max-width:600px;margin:auto; position:relative}
.card{
  background:linear-gradient(150deg, var(--card1) 0%, var(--card2) 100%);
  border-radius:34px;
  padding:26px 22px 24px;
  box-shadow:
    0 22px 0 -4px rgba(24,60,110,.10),
    0 30px 50px rgba(24,60,110,.35),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -18px 30px rgba(24,60,110,.10);
  position:relative;
}

.head-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:18px}
h1{
  margin:0; font-family:'Zilla Slab',serif; font-weight:700;
  font-size:27px; color:var(--ink); letter-spacing:.3px;
}
.att-letter{display:inline-block;opacity:0;animation:rollCall 2.6s ease forwards;animation-delay:calc(var(--i) * .07s)}
@keyframes rollCall{0%{opacity:0; transform:translateY(-6px)}60%{opacity:1; transform:translateY(0)}100%{opacity:1}}
.subtitle{
  margin:0; font-size:11.5px; color:#fff; font-weight:700; letter-spacing:.4px;
  background:linear-gradient(135deg, var(--accent1), var(--accent2));
  padding:9px 16px; border-radius:999px; white-space:nowrap;
  box-shadow:0 8px 16px rgba(74,94,224,.4), inset 0 1px 0 rgba(255,255,255,.4);
}

label{display:block;font-weight:700;margin:16px 0 8px;color:var(--ink); font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; opacity:.75}

input{
  width:100%;padding:14px 18px;border:1px solid var(--pill-border);
  border-radius:999px;font-size:15.5px;outline:none;background:var(--pill);
  color:var(--ink); font-family:inherit; font-weight:700;
  box-shadow:inset 0 2px 4px rgba(24,60,110,.08), 0 1px 0 rgba(255,255,255,.7);
  transition:box-shadow .15s, background .15s;
}
input::placeholder{color:#9aa8c0; font-weight:600}
input:focus{
  background:#fff;
  box-shadow:inset 0 2px 4px rgba(24,60,110,.08), 0 0 0 3px rgba(107,123,245,.28);
}
input[readonly]{color:var(--ink-soft)}
#className{text-transform:uppercase; font-weight:700; letter-spacing:.3px}

.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.section-title label{margin:0}
.count-badge{
  font-size:11.5px; font-weight:800; color:#fff;
  background:linear-gradient(135deg, var(--accent1), var(--accent2));
  padding:3px 11px; border-radius:999px;
  box-shadow:0 4px 10px rgba(74,94,224,.35);
}

.list-panel{
  background:rgba(255,255,255,.35);
  border-radius:22px;
  padding:10px;
  margin-top:8px;
  box-shadow:inset 0 2px 8px rgba(24,60,110,.10);
  position:relative;
}
.list-panel::before{
  content:"";
  position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  width:38px; height:6px; border-radius:6px;
  background:rgba(255,255,255,.75);
  box-shadow:0 1px 2px rgba(24,60,110,.2);
}
.list-panel:empty{display:none}

.add{
  border:none; background:rgba(255,255,255,.55); color:var(--accent2);
  width:100%; padding:12px; border-radius:999px; font-size:14px; font-weight:800;
  cursor:pointer; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:6px;
  box-shadow:0 4px 12px rgba(24,60,110,.12), inset 0 1px 0 rgba(255,255,255,.7);
  transition:background .15s, transform .1s;
}
.add:hover{background:#fff}
.add:active{transform:scale(.98)}
.add .plus{font-size:17px; line-height:1}

.row{display:flex; align-items:center; gap:10px; margin-top:8px; background:var(--pill);
  border-radius:999px; padding:8px 10px 8px 8px;
  box-shadow:0 4px 12px rgba(24,60,110,.10), inset 0 1px 0 rgba(255,255,255,.8);
}
.row:first-child{margin-top:0}
.roll-no{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%;
  background:linear-gradient(140deg, var(--accent1), var(--accent2));
  color:#fff; font-size:12.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center; font-family:'Zilla Slab',serif;
  box-shadow:0 4px 8px rgba(74,94,224,.4), inset 0 1px 0 rgba(255,255,255,.5);
}
#absentList .roll-no{background:linear-gradient(140deg,#ff8a8a,var(--absent-dot))}
#leaveList .roll-no{background:linear-gradient(140deg,#ffcb7a,var(--leave-dot))}
.row input{flex:1; box-shadow:none; background:transparent; border:none; padding:6px 4px; border-radius:0}
.row input:focus{box-shadow:none; background:transparent}
.remove{
  flex:0 0 auto; width:28px; height:28px; border:0;
  background:linear-gradient(140deg, var(--accent1), var(--accent2));
  color:#fff; font-size:16px; cursor:pointer; border-radius:50%;
  box-shadow:0 4px 8px rgba(74,94,224,.4);
  transition:transform .1s, filter .15s;
  display:flex; align-items:center; justify-content:center;
}
.remove:hover{filter:brightness(1.1)}
.remove:active{transform:scale(.9)}

.hint{font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600; padding-left:6px}

.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.stamp{
  position:relative; border:none; border-radius:999px;
  padding:16px 8px; font-family:'Zilla Slab',serif; font-weight:700; font-size:14.5px;
  letter-spacing:.4px; cursor:pointer;
  transition:transform .12s ease, filter .12s ease;
}
.stamp:active{transform:scale(.96)}
.stamp .wa-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--wa-green); margin-right:7px; vertical-align:middle;
}
.stamp.female{
  color:#fff;
  background:linear-gradient(150deg, var(--accent1), var(--accent2));
  box-shadow:0 10px 0 -3px rgba(24,60,110,.12), 0 14px 24px rgba(74,94,224,.45), inset 0 1px 0 rgba(255,255,255,.4);
}
.stamp.female:hover{filter:brightness(1.05)}
.stamp.male{
  color:var(--ink);
  background:var(--pill);
  box-shadow:0 10px 0 -3px rgba(24,60,110,.08), 0 14px 24px rgba(24,60,110,.18), inset 0 1px 0 rgba(255,255,255,.8);
}
.stamp.male:hover{background:#fff}

#preview{
  white-space:pre-wrap;background:rgba(255,255,255,.6);border:none;
  border-radius:18px;padding:14px;margin-top:18px;font-size:13.5px;display:none;
  font-family:'Inter',monospace; color:var(--ink); font-weight:600;
  box-shadow:inset 0 2px 6px rgba(24,60,110,.10);
}
.footer{text-align:center;color:rgba(28,37,54,.55);font-size:11px;margin-top:16px; font-weight:700}

@media(max-width:430px){
  .buttons{grid-template-columns:1fr 1fr; gap:8px}
  .stamp{padding:13px 4px; font-size:12.5px}
  .card{padding:22px 16px 20px; border-radius:28px}
  .subtitle{font-size:10px; padding:8px 12px}
}

/* ---------- Welcome screen ---------- */
#welcome{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,.35), transparent 45%),
    linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 100%);
  transition:opacity .45s ease, visibility .45s ease;
}
#welcome.hide{opacity:0; visibility:hidden; pointer-events:none}
.welcome-card{
  max-width:380px; width:100%; text-align:center;
  background:linear-gradient(150deg, var(--card1) 0%, var(--card2) 100%);
  border-radius:34px; padding:44px 30px 34px;
  box-shadow:
    0 22px 0 -4px rgba(24,60,110,.10),
    0 30px 50px rgba(24,60,110,.35),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -18px 30px rgba(24,60,110,.10);
  animation:floatIn .6s ease;
}
@keyframes floatIn{from{opacity:0; transform:translateY(14px) scale(.97)}to{opacity:1; transform:translateY(0) scale(1)}}
.welcome-badge{
  width:78px; height:78px; margin:0 auto 22px; border-radius:50%;
  background:linear-gradient(140deg, var(--accent1), var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-size:34px; box-shadow:0 12px 24px rgba(74,94,224,.45), inset 0 2px 0 rgba(255,255,255,.4);
  animation:pulseBadge 2.4s ease-in-out infinite;
}
@keyframes pulseBadge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.welcome-title{font-family:'Zilla Slab',serif; font-weight:700; font-size:24px; color:var(--ink); margin:0 0 8px}
#welcomeGreeting{display:block; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin-bottom:4px}
.welcome-sub{font-size:14px; color:var(--ink-soft); font-weight:600; margin:0 0 28px; line-height:1.5}
.welcome-start{
  width:100%; border:none; border-radius:999px; padding:16px 8px;
  font-family:'Zilla Slab',serif; font-weight:700; font-size:15.5px; letter-spacing:.4px;
  color:#fff; cursor:pointer;
  background:linear-gradient(150deg, var(--accent1), var(--accent2));
  box-shadow:0 10px 0 -3px rgba(24,60,110,.12), 0 14px 24px rgba(74,94,224,.45), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .12s ease, filter .12s ease;
}
.welcome-start:hover{filter:brightness(1.05)}
.welcome-start:active{transform:scale(.97)}

#appRoot{opacity:0; transition:opacity .5s ease}
#appRoot.show{opacity:1}
</style>
</head>
<body>
<div id="welcome">
  <div class="welcome-card">
    <div class="welcome-badge">👋</div>
    <span id="welcomeGreeting">Good Morning</span>
    <h2 class="welcome-title">Welcome, Teacher</h2>
    <p class="welcome-sub">Let's get today's class attendance marked and sent — it only takes a minute.</p>
    <button class="welcome-start" type="button" onclick="startApp()">Start Attendance</button>
  </div>
</div>
<div id="appRoot">
<div class="container">
  <div class="card">
    <div class="head-row">
      <h1 id="attendanceTitle" aria-label="ATTENDANCE"></h1>
      <span class="subtitle">PPS DAILY ATTENDANCE</span>
    </div>

    <label>Attendance Date</label>
    <input id="date" type="text" readonly>

    <label>Class Name</label>
    <input id="className" type="text" placeholder="e.g. 9TH A" autocomplete="off">

    <div class="section-title">
      <label>Absent Students</label>
      <span class="count-badge" id="absentCount">0</span>
    </div>
    <div class="list-panel"><div id="absentList"></div></div>
    <button class="add" type="button" onclick="addStudent('absent')"><span class="plus">+</span> Add absent student</button>
    <div class="hint">Add one student per field.</div>

    <div class="section-title">
      <label>Students on Leave</label>
      <span class="count-badge" id="leaveCount">0</span>
    </div>
    <div class="list-panel"><div id="leaveList"></div></div>
    <button class="add" type="button" onclick="addStudent('leave')"><span class="plus">+</span> Add student on leave</button>
    <div class="hint">Add students who are on leave.</div>

    <label>Form Master Name</label>
    <input id="master" type="text" placeholder="Enter form master's name" autocomplete="off">

    <div class="buttons">
      <button class="stamp female" type="button" onclick="sendWhatsApp('03400968477')"><span class="wa-dot"></span>FEMALE STAFF</button>
      <button class="stamp male" type="button" onclick="sendWhatsApp('03099795054')"><span class="wa-dot"></span>MALE STAFF</button>
    </div>

    <div id="preview"></div>
  </div>
  <div class="footer">Attendance Messenger · Mobile Friendly</div>
</div>
</div>

<script>
function startApp(){
  document.getElementById("welcome").classList.add("hide");
  document.getElementById("appRoot").classList.add("show");
  document.getElementById("className").focus();
}
function setGreeting(){
  const h=new Date().getHours();
  const el=document.getElementById("welcomeGreeting");
  el.textContent = h<12 ? "Good Morning" : h<17 ? "Good Afternoon" : "Good Evening";
}
setGreeting();

let audioCtx;
function playKeySound(deleting=false){
  try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime; o.type="sine"; o.frequency.setValueAtTime(deleting?180:420,n); o.frequency.exponentialRampToValueAtTime(deleting?110:300,n+.045); g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(deleting?.035:.025,n+.006); g.gain.exponentialRampToValueAtTime(.0001,n+.055); o.connect(g).connect(audioCtx.destination); o.start(n); o.stop(n+.06);}catch(e){}
}

function currentDeviceDate(){
  const d=new Date();
  const day=String(d.getDate()).padStart(2,'0');
  const month=d.toLocaleString('en-US',{month:'long'});
  const year=d.getFullYear();
  return `${day} ${month} ${year}`;
}
document.getElementById("date").value=currentDeviceDate();

const classInput=document.getElementById("className");
classInput.addEventListener("input",()=>{
  const pos=classInput.selectionStart;
  classInput.value=classInput.value.toUpperCase();
  classInput.setSelectionRange(pos,pos);
});

function capitalizeWords(value){
  return value.replace(/(^|\s)(\S)/g,(m,space,letter)=>space+letter.toUpperCase());
}

function updateCounts(){
  document.getElementById("absentCount").textContent = getNames("absent").length;
  document.getElementById("leaveCount").textContent = getNames("leave").length;
}

function renumber(type){
  const list=document.getElementById(type+"List");
  [...list.querySelectorAll(".roll-no")].forEach((el,i)=>{el.textContent=i+1;});
}

function addStudent(type){
  const list=document.getElementById(type+"List");
  const row=document.createElement("div");
  row.className="row";
  const rollNo=list.children.length+1;
  row.innerHTML=`<span class="roll-no">${rollNo}</span>
                 <input type="text" class="${type}" placeholder="Student name">
                 <button class="remove" type="button" aria-label="Remove">×</button>`;
  list.appendChild(row);
  const input=row.querySelector("input");
  input.addEventListener("input",()=>{
    const pos=input.selectionStart;
    input.value=capitalizeWords(input.value);
    input.setSelectionRange(pos,pos);
    updateCounts();
  });
  row.querySelector(".remove").addEventListener("click",()=>{
    row.remove();
    renumber(type);
    updateCounts();
  });
  input.focus();
  updateCounts();
}

function getNames(cls){
  return [...document.querySelectorAll("."+cls)]
    .map(x=>x.value.trim()).filter(Boolean);
}

function makeMessage(){
  const cls=document.getElementById("className").value.trim() || "CLASS";
  const absent=getNames("absent");
  const leave=getNames("leave");
  const master=document.getElementById("master").value.trim();

  let msg=`*CLASS ${cls}  |  ATTENDANCE*\n`;
  msg+=`Date: ${document.getElementById("date").value}\n\n`;
  msg+=`*ABSENT STUDENTS*\n`;

  if(absent.length){
    absent.forEach((student,i)=>{
      msg+=`${i+1}. ${student}\n`;
    });
  }else{
    msg+="No absent students\n";
  }

  msg+=`\n*STUDENTS ON LEAVE*\n`;
  if(leave.length){
    leave.forEach((student,i)=>{
      msg+=`${i+1}. ${student}\n`;
    });
  }else{
    msg+="None";
  }
  if(master){msg+=`\n\nForm Master: *${master}*`;}

  return msg;
}

// Converts a Pakistani number in any common local format into the
// digits-only international format wa.me requires (country code, no
// leading 0, no +, no spaces/dashes).
function normalizePhone(raw){
  let digits = raw.replace(/\D/g,""); // strip everything but digits
  if(digits.startsWith("0")){
    digits = "92" + digits.slice(1);   // 03XXXXXXXXX -> 923XXXXXXXXX
  }else if(!digits.startsWith("92")){
    digits = "92" + digits;            // bare 3XXXXXXXXX -> 923XXXXXXXXX
  }
  return digits;
}

function sendWhatsApp(number){
  const msg=makeMessage();
  const phone=normalizePhone(number);
  const url="https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}

async function offlineMessage(){
  const msg=makeMessage();
  const preview=document.getElementById("preview");
  preview.style.display="block";
  preview.textContent=msg;

  if(navigator.share){
    try{
      await navigator.share({title:"ATTENDANCE", text:msg});
      return;
    }catch(e){}
  }

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(msg);
      alert("Attendance message copied. You can paste it into WhatsApp, SMS, or any other app.");
      return;
    }
  }catch(e){}

  try{
    const range=document.createRange();
    range.selectNodeContents(preview);
    const selection=window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }catch(e){}

  alert("The attendance message is shown below. Select and copy it, then paste it into WhatsApp, SMS, or any other app.");
}

addStudent("absent");
addStudent("leave");
document.addEventListener("input",e=>{if(e.target.matches("input")&&e.target.value)playKeySound(false);});
document.addEventListener("keydown",e=>{if(e.target.matches("input")&&e.key==="Backspace")playKeySound(true);});

const title=document.getElementById("attendanceTitle");
"ATTENDANCE".split("").forEach((letter,i)=>{
  const s=document.createElement("span");
  s.className="att-letter"; s.style.setProperty("--i",i); s.textContent=letter;
  title.appendChild(s);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
